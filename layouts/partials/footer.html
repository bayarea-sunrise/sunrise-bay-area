<footer class="footer center">
  <style>
    .substack-icon{display:block;width:18px;height:18px}
    .footer .list-inline{display:flex;align-items:center;justify-content:center;gap:.5rem}
    .footer .list-inline-item{display:flex;align-items:center;margin:0}
  </style>
  <div class="container">
    <div class="footer-element">
      <ul class="list-inline">
        {{ with .Site.Data.footer.twitterUrl }}
          <li class="list-inline-item">
            <a class="social-link rounded-circle" href="{{ . }}" target="_blank" rel="noreferrer">
              <i class="icon-social-twitter"></i>
              <p class="hidden">Twitter</p>
            </a>
          </li>
        {{ end }}
        {{ with .Site.Data.footer.instagramUrl }}
          <li class="list-inline-item">
            <a class="social-link rounded-circle" href="{{ . }}" target="_blank" rel="noreferrer">
              <i class="icon-social-instagram"></i>
              <p class="hidden">Instagram</p>
            </a>
          </li>
        {{ end }}
        {{ with .Site.Data.footer.email }}
          <li class="list-inline-item">
            <a class="social-link rounded-circle" href="mailto:{{ . }}" target="_top" rel="noreferrer">
              <i class="icon-envelope"></i>
              <p class="hidden">Email</p>
            </a>
          </li>
        {{ end }}
        <li class="list-inline-item">
          <a class="social-link rounded-circle" href="https://substack.com/@sunrisebayarea" target="_blank" rel="noreferrer" aria-label="Substack">
            <svg class="substack-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18l-6-3-6 3V3z"></path>
            </svg>
            <p class="hidden">Substack</p>
          </a>
        </li>
      </ul>
    </div>
    <div class="footer-element">
      <p class="copyright">Copyright &copy; Sunrise Movement 2026</p>
    </div>
  </div>
</footer>
